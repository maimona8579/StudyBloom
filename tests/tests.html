<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>StudyBloom Unit Tests</title>
  <style>
    body { font-family: sans-serif; padding: 1.5rem; max-width: 800px; margin: 0 auto; line-height: 1.5; }
    .summary { font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem; padding: 0.75rem; border-radius: 6px; }
    .pass-summary { background: #d4edda; color: #155724; }
    .fail-summary { background: #f8d7da; color: #721c24; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.4rem 0.6rem; margin-bottom: 0.3rem; border-radius: 4px; font-family: monospace; }
    li.pass { background: #e8f5e9; color: #2e7d32; }
    li.fail { background: #ffebee; color: #c62828; }
  </style>
  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/tasks.js"></script>
  <script src="../js/notes.js"></script>
  <script src="../js/days.js"></script>
  <script src="../js/calendar.js"></script>
</head>
<body>
  <h1>StudyBloom Unit Tests</h1>
  <div id="summary" class="summary">Running tests...</div>
  <ul id="results"></ul>

  <script>
    (function () {
      let passed = 0;
      let failed = 0;
      const resultsEl = document.getElementById("results");
      const summaryEl = document.getElementById("summary");

      function assert(desc, condition) {
        const li = document.createElement("li");
        if (condition) {
          passed++;
          li.className = "pass";
          li.textContent = "✔ PASS: " + desc;
        } else {
          failed++;
          li.className = "fail";
          li.textContent = "✖ FAIL: " + desc;
        }
        resultsEl.appendChild(li);
      }

      const U = StudyBloom.utils;
      const S = StudyBloom.storage;
      const T = StudyBloom.tasks;
      const N = StudyBloom.notes;
      const D = StudyBloom.days;
      const C = StudyBloom.calendar;

      // 1. utils.addDays across month ends
      assert("addDays across Jan -> Feb", U.addDays("2026-01-31", 1) === "2026-02-01");
      assert("addDays across Feb -> Mar (non-leap)", U.addDays("2026-02-28", 1) === "2026-03-01");
      assert("addDays across Year end Dec -> Jan", U.addDays("2026-12-31", 1) === "2027-01-01");
      assert("addDays negative offset", U.addDays("2026-03-01", -1) === "2026-02-28");

      // 2. utils.formatDate and today
      assert("today returns YYYY-MM-DD", /^\d{4}-\d{2}-\d{2}$/.test(U.today()));
      assert("generateId returns non-empty string", typeof U.generateId() === "string" && U.generateId().length > 5);

      // 3. tasks validation & normalization
      const vTaskGood = T.validateTask({ title: "Study Math", priority: "high" });
      assert("validateTask passes for valid input", vTaskGood.valid === true && vTaskGood.task.title === "Study Math");

      const vTaskNoTitle = T.validateTask({ title: "   " });
      assert("validateTask fails without title", vTaskNoTitle.valid === false && vTaskNoTitle.errors.length > 0);

      // Edit normalization bug fix
      const createdT = T.createTask({ title: "  Math HW  ", subject: "Math", priority: "medium" });
      const updatedT = T.updateTask(createdT.task.id, { title: "  Trimmed Math  ", subject: "   " });
      assert("updateTask normalizes empty subject to General", updatedT.task.subject === "General");
      assert("updateTask trims title", updatedT.task.title === "Trimmed Math");

      // isOverdue
      assert("isOverdue true for past pending task", T.isOverdue({ completed: false, due: "2026-10-10T00:00:00.000Z" }, "2026-10-18") === true);
      assert("isOverdue false for future task", T.isOverdue({ completed: false, due: "2026-10-25T00:00:00.000Z" }, "2026-10-18") === false);
      assert("isOverdue false for completed task", T.isOverdue({ completed: true, due: "2026-10-10T00:00:00.000Z" }, "2026-10-18") === false);

      // 4. loadTasks filtering corrupt data
      const corruptTasks = [
        null,
        {},
        { id: "bad1" },
        { id: "good1", title: "Valid Task", priority: "medium", completed: false, due: null }
      ];
      S.setItem("tasks", JSON.stringify(corruptTasks));
      const loadedTasks = T.loadTasks();
      assert("loadTasks filters out corrupt records and keeps only valid", loadedTasks.length === 1 && loadedTasks[0].id === "good1");

      // 5. notes validation & edit normalization
      const vNoteGood = N.validateNote({ title: "Note 1", body: "Note content" });
      assert("validateNote passes for valid input", vNoteGood.valid === true && vNoteGood.note.title === "Note 1");

      const createdN = N.createNote({ title: "  Biology Note  ", subject: "Bio", body: "Content" });
      const updatedN = N.updateNote(createdN.note.id, { title: "  New Bio  ", subject: "" });
      assert("updateNote normalizes empty subject to General", updatedN.note.subject === "General");
      assert("updateNote trims title", updatedN.note.title === "New Bio");

      // 6. days validation
      const vSlotGood = D.validateSlot({ start: "09:00", end: "10:30", text: "Math practice" });
      assert("validateSlot passes with valid start, end, text", vSlotGood.valid === true && vSlotGood.slot.start === "09:00");
      assert("validateGoal passes with text", D.validateGoal("Finish chemistry assignment").valid === true);
      assert("sortSlots sorts chronologically by start", D.sortSlots([{ start: "14:00" }, { start: "08:30" }])[0].start === "08:30");
      assert("setWater updates count within 0-8", D.setWater({ water: 0 }, 5) === 5);

      // 7. calendar tests (Oct 2026)
      const octGrid = C.monthGrid(2026, 9);
      assert("monthGrid(2026, 9) length is 42", octGrid.length === 42);
      assert("first cell of Oct 2026 is 2026-09-28", octGrid[0].date === "2026-09-28");
      assert("last cell of Oct 2026 is 2026-11-08", octGrid[41].date === "2026-11-08");
      assert("inMonth true only for Oct 1-31", octGrid.filter(c => c.inMonth).length === 31);
      assert("shiftMonth(2026, 11, 1) rolls to 2027-0", C.shiftMonth(2026, 11, 1).year === 2027 && C.shiftMonth(2026, 11, 1).month0 === 0);
      assert("shiftMonth(2026, 0, -1) rolls to 2025-11", C.shiftMonth(2026, 0, -1).year === 2025 && C.shiftMonth(2026, 0, -1).month0 === 11);

      const grouped = C.tasksByDate([
        { id: "1", due: "2026-10-18T00:00:00.000Z" },
        { id: "2", due: "2026-10-18T10:00:00.000Z" },
        { id: "3", due: null }
      ]);
      assert("tasksByDate groups same due date and skips null", grouped["2026-10-18"].length === 2 && !grouped["null"]);

      const dStatus = C.dayStatus([
        { completed: false, due: "2026-10-15T00:00:00.000Z" },
        { completed: false, due: "2026-10-18T00:00:00.000Z" },
        { completed: true, due: "2026-10-10T00:00:00.000Z" }
      ], "2026-10-18");
      assert("dayStatus returns pending: 2, done: 1, overdue: 1", dStatus.pending === 2 && dStatus.done === 1 && dStatus.overdue === 1);

      // Clean up test keys
      S.removeItem("tasks");
      S.removeItem("notes");
      S.removeItem("days");

      // Summary
      summaryEl.textContent = "Completed: " + passed + " passed, " + failed + " failed.";
      summaryEl.className = "summary " + (failed === 0 ? "pass-summary" : "fail-summary");
    })();
  </script>
</body>
</html>
